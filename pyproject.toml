[project]
name = "garra-rufa"
version = "0.1.0"
description = "Approved-source fetchers for the rare-disease atlas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["requests>=2.32", "networkx>=3"]

[project.scripts]
fetch-sources = "garra.sources.cli:main"
atlas = "garra.atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
